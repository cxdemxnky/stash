name: Downloads
description: A "Downloads" page showing the progress of every download queued by the downloader userscripts, and a "Read names" button on scene pages that reads performer names from the video.
version: 1.0.0
ui:
  javascript:
    - downloads.js
    - names.js
  css:
    - downloads.css
  csp:
    connect-src:
      - "http://*:10141"
settings:
  downloader_url:
    displayName: Downloader address
    description: Defaults to this Stash host on port 10141, e.g. http://192.168.1.10:10141
    type: STRING
  token:
    displayName: Downloader token
    description: Needed for Retry, reordering the queue and Read names (DOWNLOADER_TOKEN in ~/.config/stash-downloader/env)
    type: STRING
